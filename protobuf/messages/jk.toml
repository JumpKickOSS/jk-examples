# The protobuf plugin: provisioned per-OS protoc, Java + Kotlin DSL codegen (lite),
# generated sources joining both compilers and the packaged jar.

name    = "messages"
group   = "dev.jkharness"
version = "1.0.0"
java    = 25
kotlin  = "2.4.20"

[application]
main = "dev.jkharness.pb.MainKt"

# protoc and the runtime library are one protobuf release.
[protobuf]
version = "4.36.1"
lite    = true
kotlin  = true

[dependencies]
protobuf-kotlin-lite = "4.36.1"
