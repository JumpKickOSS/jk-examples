# A JavaFX desktop app: FXML view, a controller, and the arithmetic in a plain class that tests
# without a display. [javafx] puts the OpenJFX jars on the module path for jk run and the tests;
# the lock pins this host's javafx-graphics classifier.

name    = "loans"
group   = "dev.jkexamples"
version = "0.1.0"
java    = 25

[application]
main     = "dev.jkexamples.loans.Launcher"

[javafx]
modules = ["javafx.controls", "javafx.fxml"]

[dependencies]
javafx-controls = { group = "org.openjfx", version = "27.0.1" }
javafx-fxml     = { group = "org.openjfx", version = "27.0.1" }

[test-dependencies]
junit-jupiter = "6.1.3"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
# @FXML fields are injected by the FXML loader after construction, which NullAway cannot see.
options = ["-XepOpt:NullAway:ExcludedFieldAnnotations=javafx.fxml.FXML"]
