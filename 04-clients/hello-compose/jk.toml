# A minimal Compose app: one screen, a ViewModel, tests on the JVM (plain JUnit and Robolectric),
# and a debug APK. No Gradle, no AGP: the android plugin compiles, links resources, dexes and
# packages; `jk run` installs and launches on a connected device or emulator.

group   = "dev.jkexamples"
name    = "hello-compose"
version = "0.1.0"
# Language level 21: d8 desugars 21-bytecode today; the host JDK 25 cross-compiles it.
java    = 21
kotlin  = "2.4.21"

[android]
namespace   = "dev.jkexamples.hello"
compile-sdk = 36
min-sdk     = 24
compose     = true

[platform-dependencies]
compose-bom = { group = "androidx.compose", name = "compose-bom", version = "2026.09.00" }

[dependencies]
# activity-compose is androidx.activity's group — the Compose BOM does not manage it.
activity-compose          = "androidx.activity:activity-compose:1.13.0"
lifecycle-viewmodel-compose = "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
compose-ui                = { group = "androidx.compose.ui", name = "ui" }
compose-material3         = { group = "androidx.compose.material3", name = "material3" }

[test-dependencies]
junit-jupiter   = "6.1.3"
# Robolectric runs JUnit 4 tests; the vintage engine runs them beside the JUnit 5 ones.
junit           = "junit:junit:4.13.2"
junit-vintage   = "org.junit.vintage:junit-vintage-engine:6.1.3"
robolectric     = "org.robolectric:robolectric:4.17"
ui-test-junit4  = { group = "androidx.compose.ui", name = "ui-test-junit4" }
ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[repositories]
central = "https://repo.maven.apache.org/maven2/"
google  = "https://dl.google.com/dl/android/maven2/"

