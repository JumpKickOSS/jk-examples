group   = "com.example"
name    = "hello-http"
version = "0.1.0"
java    = 25

[application]
main = "com.example.hello.Application"
# Micronaut apps ship as a single runnable fat jar (Maven shade parity).
assembly = true

# Newest stable Micronaut platform; jk-lock.toml pins the exact version.
[micronaut]
version = "5.1.5"
# Optional deploy optimization:
# aot = true
# aot-runtime = "jit"   # or "native" with [native]

# A shippable container: a JRE 25 base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

[dependencies]
micronaut-http-server-netty = "io.micronaut:micronaut-http-server-netty"
micronaut-jackson-databind  = "io.micronaut:micronaut-jackson-databind"
logback                     = "ch.qos.logback:logback-classic"

[processor-dependencies]
micronaut-inject-java = "io.micronaut:micronaut-inject-java"

[test-dependencies]
micronaut-test-junit5 = "io.micronaut.test:micronaut-test-junit5"
micronaut-http-client = "io.micronaut:micronaut-http-client"
junit-jupiter         = "org.junit.jupiter:junit-jupiter"

# Test tiers. Bare `jk test` is the unit tier; each profile owns exactly one of the excluded
# tags, so every tagged test runs in one tier and none is silently skipped.
[test]
exclude-tags = ["integration", "slow", "network", "bench"]

[profiles.integration]
include-tags = ["integration"]
exclude-tags = []

[profiles.network]
include-tags = ["network"]
exclude-tags = ["integration"]

[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["integration", "network"]

[profiles.bench]
include-tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[profiles.ci]
exclude-tags = ["integration", "slow", "network", "bench"]
