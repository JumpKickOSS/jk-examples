# Four lint tools as cached steps after compile: Checkstyle and PMD over the Java sources,
# SpotBugs over the compiled classes, detekt over the Kotlin sources. Each is one step
# (`lint-checkstyle`, `lint-pmd`, `lint-spotbugs`, `lint-detekt`), its report read back into
# diagnostics with the rule id, and a finding at `fail-on` severity fails the build. None of the
# tools is in [dependencies]; each is fetched at its pinned release.

name    = "lint-all-tools"
group   = "com.example"
version = "0.0.1"
java    = 25
kotlin  = "2.4.20"

[application]
main = "demo.Sample"

[lint]
checkstyle = "checkstyle.xml"                    # the rules a formatter cannot decide
pmd        = ["pmd.xml"]                         # PMD's best-practices category, minus the rule this demo breaks on purpose
spotbugs   = true                                # over target/classes, against the compile classpath
detekt     = true                                # detekt's default rule set over src/main/kotlin
# fail-on  = "error"                             # error (default) | warning | never

# Compile-time only (@NullMarked): on javac's path, in no jar.
[provided-dependencies]
jspecify = "1.0.1"

[test-dependencies]
junit-jupiter = "6.1.3"

# Test tiers: `jk test` is the unit tier; each profile owns one of the excluded tags, so every
# tagged test runs in exactly one tier.
[test]
exclude-tags = ["integration", "slow", "network", "bench"]

[profiles.integration]
include-tags = ["integration"]
exclude-tags = []

[profiles.network]
include-tags = ["network"]
exclude-tags = ["integration"]

[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["integration", "network"]

[profiles.bench]
include-tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]
