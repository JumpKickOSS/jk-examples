# Avro schemas as generated classes: [avro] runs Avro's SpecificCompiler over src/main/avro in the
# generate stage, the classes join the compile, and a schema edit regenerates. No compiler jar is in
# [dependencies]; the preset fetches it at the [avro] version.

name    = "avro-events"
group   = "com.acme"
version = "1.0.0"
java    = 25

[application]
main = "com.acme.Main"

# An Avro string is a java.lang.String on the generated getters (CharSequence is the compiler's
# default). `version` is the compiler release, written out so it moves with the runtime below.
[avro]
version     = "1.12.2"
string-type = "String"

[dependencies]
avro = "1.12.2"     # the generated classes read it at run time; on the compiler's number

[test-dependencies]
junit-jupiter = "6.1.3"

[test]
# Avro 1.12 decodes a specific record only into a class it is told to trust; the generated package
# is named here for the forked test JVM, where the round-trip test decodes one. The application only
# builds an event, so its JVM needs no such flag.
system-properties = { "org.apache.avro.SERIALIZABLE_PACKAGES" = "com.acme.events" }

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
# The generated classes (com.acme.events) are written by the codegen plugin and carry no nullness annotations.
exclude = ["com.acme.events"]
