# The [antlr] preset: a grammar under src/main/antlr4 becomes a lexer, a parser and a visitor in the
# generate stage, in the package its directory names, and the classes join the compile. The tool
# is fetched at [antlr] version; the runtime the parser reads is pinned beside it.

name    = "calc"
group   = "dev.jkexamples"
version = "0.1.0"
java    = 25

[application]
main = "dev.jkexamples.calc.Main"

[antlr]
version  = "4.13.2"
visitor  = true
listener = false

[dependencies]
antlr4-runtime = "4.13.2"   # on the tool's number; `jk update` moves both

[test-dependencies]
junit-jupiter = "6.1.3"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
