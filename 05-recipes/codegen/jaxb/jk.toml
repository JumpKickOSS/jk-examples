# XML schemas as generated classes: [jaxb] runs xjc over src/main/xsd in the generate stage, the
# classes join the compile, and a schema edit regenerates. xjc itself is not in [dependencies];
# the preset fetches it at the [jaxb] version.

name    = "jaxb-orders"
group   = "com.acme"
version = "1.0.0"
java    = 25

[application]
main = "com.acme.Main"

# One package for every generated class (-p) in place of the schema's namespace-derived one.
# `version` is the xjc release, written out so it moves with jaxb-runtime below.
[jaxb]
version = "4.0.9"
package = "com.acme.order"

[dependencies]
jakarta-xml-bind-api = "4.0.5"    # the generated classes' annotations
jaxb-runtime         = "4.0.9"    # the JAXB implementation at run time, on xjc's line

[test-dependencies]
junit-jupiter = "6.1.3"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
# The generated classes (com.acme.order) are written by the codegen plugin and carry no nullness annotations.
exclude = ["com.acme.order"]
