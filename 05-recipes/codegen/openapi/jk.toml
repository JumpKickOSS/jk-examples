group = "dev.jkexamples"
name = "openapi"
version = "0.1.0"
java = 25

[application]
main = "com.acme.Application"

# Two plugins in one module: Boot packages the jar and owns the platform BOM, the generator
# contributes a step. Each forks its own worker.
[spring-boot]
version = "4.1.1"

# The contract generates the GreetingsApi interface and the Greeting model into the generate
# stage; GreetingController implements the interface. Edit api/openapi.yaml and the next build
# regenerates and recompiles; an unchanged spec is a cache hit (`jk explain`).
# useJspecify: the spring generator writes org.jspecify.annotations.Nullable (Spring Framework 7
# deprecated org.springframework.lang.Nullable).
[openapi]
spec      = "api/openapi.yaml"
generator = "spring"
package   = "com.acme.api"
options   = { useJspecify = "true" }

# Versionless coordinates: the Boot platform BOM the [spring-boot] table imports manages them.
[dependencies]
starter-webmvc     = "org.springframework.boot:spring-boot-starter-webmvc"
starter-validation = "org.springframework.boot:spring-boot-starter-validation"
jspecify           = "1.0.1"

[test-dependencies]
starter-test = "org.springframework.boot:spring-boot-starter-test"

# NullAway over JSpecify: every package is @NullMarked (hand-written package-info; the generator
# emits the same for com.acme.api*), so types are non-null unless marked @Nullable. @Generated
# models keep a JavaBeans empty ctor that leaves required fields unset until setters run — NullAway
# would reject that, so TreatGeneratedAsUnannotated leaves those types to their JSpecify surface
# for IDEs while still enforcing this module's own code.
[javac]
plugins = { ErrorProne = { options = ["-Xep:NullAway:ERROR", "-XepOpt:NullAway:OnlyNullMarked=true", "-XepOpt:NullAway:JSpecifyMode=true", "-XepOpt:NullAway:TreatGeneratedAsUnannotated=true", "-XepDisableWarningsInGeneratedCode"] } }
args    = ["-XDcompilePolicy=simple", "--should-stop=ifError=FLOW"]

[processor-dependencies]
error_prone_core = "com.google.errorprone:error_prone_core:2.51.0"
nullaway         = "com.uber.nullaway:nullaway:0.14.2"
