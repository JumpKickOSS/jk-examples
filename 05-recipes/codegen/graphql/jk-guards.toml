# House rules, from the starter pack this template ships with; `jk lock` pins it, `jk guard explain`
# lists its rules. Add your own [guards.<id>] tables below; exempt a site with `allow` and a reason.
[guards]
extends = ["cc.jumpkick.guards:library:0.52.0"]

# Generated code: the generator owns these packages and writes no @NullMarked package-info.
[[guards.null-marked-packages.allow]]
in     = "com.acme.graphql.client"
reason = "the DGS client classes the codegen step writes; the generator does not annotate them, and a package-info in src would mark code it owns"

[[guards.null-marked-packages.allow]]
in     = "com.acme.graphql.types"
reason = "the DGS types the codegen step writes; the generator does not annotate them, and a package-info in src would mark code it owns"
