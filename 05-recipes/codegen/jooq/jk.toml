# jOOQ classes from the migrations: [jooq] applies the Flyway scripts under db/migration to an
# in-memory database in the generate stage and generates the tables' classes, which join the
# compile; a migration edit regenerates and no database runs for the build. The generator is not
# in [dependencies]; the preset fetches it at the [jooq] version.

name    = "jooq-shop"
group   = "com.acme"
version = "1.0.0"
java    = 25

[application]
main = "com.acme.Main"

# The scripts default to src/main/resources/db/migration/**/*.sql and the package to <group>.jooq.
# Flyway's own history table is a table like any other to DDLDatabase, so it is left out here.
# `version` is the generator release, written out so it moves with the runtime below.
[jooq]
version  = "3.21.9"
excludes = "flyway_schema_history"

[dependencies]
jooq = "3.21.9"     # the generated classes read it at run time; on the generator's number

[test-dependencies]
junit-jupiter = "6.1.3"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
