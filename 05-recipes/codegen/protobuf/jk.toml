# The protobuf plugin: provisioned per-OS protoc, Java + Kotlin DSL codegen (lite),
# generated sources joining both compilers and the packaged jar.

name    = "messages"
group   = "dev.jkharness"
version = "1.0.0"
java    = 25
kotlin  = "2.4.21"

[application]
main = "dev.jkharness.pb.MainKt"
# protobuf-javalite reads memory through sun.misc.Unsafe; JDK 24+ warns about that unless allowed.
jvm-args = ["--sun-misc-unsafe-memory-access=allow"]

# protoc and the runtime library are one protobuf release.
[protobuf]
version = "4.36.2"
lite    = true
kotlin  = true

[dependencies]
protobuf-kotlin-lite = "4.36.2"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"
