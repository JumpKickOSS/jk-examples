# Core [variants]: one custom dimension (contentType) on a plain JVM app — per-value
# sources via extra-src and per-value dependencies. `jk lock` resolves the UNION of both
# values' deps (one lockfile covers every variant); a build folds only the selected value.
#
#   jk build --variant contentType=demo     # stub backend, no external client dep
#   jk build --variant contentType=prod     # real Backend using commons-lang3
#   jk build --variant demo                 # bare value works: only one custom dimension
#   jk build                                # the dimension's default, demo

name    = "variants-cli"
group   = "dev.jkexamples"
version = "1.0.0"
java    = 25

[application]
main     = "dev.jkexamples.vcli.Main"
assembly = true   # java -jar runnable for either variant

# A build that selects no value builds this one; without a default every verb that builds
# needs --variant.
[variants.contentType]
default = "demo"

[variants.contentType.demo]
extra-src = ["src-demo"]

[variants.contentType.prod]
extra-src = ["src-prod"]

[variants.contentType.prod.dependencies]
commons-lang3 = "3.21.0"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
