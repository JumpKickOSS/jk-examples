# The decision matrix as running code (see jk docs/user/projects.md, "Features, profiles, variants"):
#
#   PROFILE  — how to build:   [profiles.strict] turns javac lint into errors. Optional;
#              same artifact either way.            jk build --profile strict
#   FEATURE  — what capability: [features.json] gates the gson dep. Optional, additive.
#                                                   jk build (on by default)
#                                                   jk tree --no-default-features (the graph without it)
#   VARIANT  — which product:  the built-in build-type dimension; release compiles the
#              extra ReleaseStamp class from src-release.   jk build --release
#
# Environments (dev/test/prod config) are NONE of these — that's runtime configuration
# (env vars, config files, Spring profiles): build once, promote the same artifact.

name    = "profiles-vs-variants"
group   = "dev.jkexamples"
version = "1.0.0"
java    = 25

[application]
main     = "dev.jkexamples.matrix.Main"
assembly = true   # java -jar runnable with the feature dep on the classpath

[profiles.strict]
javac = ["-Werror"]

[features]
default = ["json"]

[features.json]
deps = ["gson"]

[dependencies]
gson = { group = "com.google.code.gson", name = "gson", version = "2.15.0", optional = true }

[variants.build-type.release]
extra-src = ["src-release"]

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
