# The minified jar: R8 --classfile full mode over the app + runtime closure, packaged
# as one slim executable jar. Validation is behavioral (the jar runs) and structural
# (unreferenced library code is absent); the README's size numbers describe the pinned
# commons-lang3 build.

name    = "shrink-cli"
group   = "dev.jkharness"
version = "1.0.0"
java    = 25

[application]
main     = "dev.jkharness.slim.Main"
minified = true

[minified]
# keep = ["-keep class dev.jkharness.slim.** { *; }"]   # jk derives keep rules from the jar's indexes
# obfuscate = false

[dependencies]
commons-lang3 = "3.21.0"
