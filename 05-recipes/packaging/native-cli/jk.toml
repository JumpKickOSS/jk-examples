# A command-line tool shipped as a native executable: `jk native` builds it with GraalVM, and
# picocli's own annotation processor writes the reflection config native-image needs, so there is
# no hand-written native-image config.

group = "dev.jkexamples"
name = "sums"
version = "0.1.0"
java = 25

[application]
main = "dev.jkexamples.sums.Sums"

# `jk native` builds target/sums; `jk build` stays a JVM build.
[native]
enabled = true

[dependencies]
picocli = "4.7.7"

# picocli's annotation processor writes the reflection config native-image needs for the
# annotated command (META-INF/native-image/picocli-generated/sums/) into the classes.
[processor-dependencies]
picocli-codegen = "info.picocli:picocli-codegen:4.7.7"

[test-dependencies]
junit-jupiter = "6.1.3"

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
# picocli injects @Option, @Parameters and @Spec fields after construction, which NullAway cannot see.
options = ["-XepOpt:NullAway:ExcludedFieldAnnotations=picocli.CommandLine.Option,picocli.CommandLine.Parameters,picocli.CommandLine.Spec"]
