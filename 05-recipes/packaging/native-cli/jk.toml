# A command-line tool shipped as a native executable: `jk native` builds it with GraalVM, and
# picocli's own annotation processor writes the reflection config native-image needs, so there is
# no hand-written native-image config.

group = "dev.jkexamples"
name = "sums"
version = "0.1.0"
java = 25

[application]
main = "dev.jkexamples.sums.Sums"

# `jk native` builds target/sums; `jk build` stays a JVM build.
[native]
enabled = true

[dependencies]
picocli = "4.7.7"

# picocli's annotation processor writes the reflection config native-image needs for the
# annotated command (META-INF/native-image/picocli-generated/sums/) into the classes.
[processor-dependencies]
picocli-codegen = "info.picocli:picocli-codegen:4.7.7"

[test-dependencies]
junit-jupiter = "6.1.3"

[format]
style = "standard"
