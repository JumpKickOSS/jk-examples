# Flyway and Liquibase over one module's scripts: the Flyway migrations under db/migration and the
# Liquibase change log under db/changelog are resources, the application applies both at startup,
# the unit tier proves them on an in-memory H2, and the integration tier on a PostgreSQL
# Testcontainer. Nothing about migrations is in this manifest beyond the libraries: outside the
# application the tools are commands against a database (README).

name    = "migrations"
group   = "com.acme"
version = "1.0.0"
java    = 25

[application]
main = "com.acme.db.Main"

[dependencies]
flyway-core       = "13.12.0"
flyway-postgresql = "13.12.0"    # Flyway's PostgreSQL support ships as its own module
liquibase-core    = "5.0.4"
postgresql        = "42.7.14"    # the driver the Postgres URL needs
h2                = "2.5.252"    # the driver `jk run` and the unit tier use

[test-dependencies]
junit-jupiter             = "6.1.3"
testcontainers-postgresql = "org.testcontainers:testcontainers-postgresql:2.0.5"
slf4j-simple              = "2.0.20"   # Testcontainers, Flyway and Liquibase log through SLF4J

# Liquibase 5 asks config.liquibase.com whether to send usage analytics on every run. A suite that
# talks to another host stores no green marker, so the H2 tier ran again on every build; with
# analytics off it reaches nothing past this host and is replayed while its inputs hold.
[test]
system-properties = { "liquibase.analytics.enabled" = "false" }

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]
