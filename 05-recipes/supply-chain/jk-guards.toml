# House rules: the starter pack `jk new` ships with (`library`: explicit locales and charsets,
# @NullMarked packages, released and converged dependencies, a file-size ratchet), and the
# supply-chain rules beside it. They run inside `jk build`; `jk lock` pins the pack.
[guards]
extends = ["cc.jumpkick.guards:library:0.52.0"]

[guards.no-floating-versions]
kind        = "depend"
no-dynamic  = true
no-snapshot = true
why         = "a version the lock does not name exactly is a supply-chain hole"

[guards.test-libraries-stay-in-test]
kind        = "depend"
coordinate  = "commons-io:commons-io"
only-in     = ["test-dependencies"]
instead     = "java.nio.file.Files"
why         = "the accepted advisory is acceptable only while the library never ships"

[guards.no-copyleft-in-what-ships]
kind     = "depend"
licenses = { forbid = ["GPL-*", "AGPL-*", "LGPL-*"] }
scopes   = ["main", "runtime"]
why      = "a copyleft licence on a shipped dependency is a legal review, not a build"
