# Supply-chain hygiene as part of the build: every byte pinned by the lock (with its checksum and
# the licences its POM declares), a deny list of repositories and an allow list of licences, an
# advisory audit that gates CI, one reviewed advisory accepted with a reason and an expiry, and an
# SBOM of what ships.

name    = "csvjson"
group   = "dev.jkexamples"
version = "0.1.0"
java    = 25

[application]
main = "dev.jkexamples.csvjson.Main"

[dependencies]
jackson-databind = "tools.jackson.core:jackson-databind:3.2.4"

[test-dependencies]
junit-jupiter = "6.1.3"
# Pinned below the fix on purpose, to show an accepted advisory; see [audit] and the README.
commons-io = "commons-io:commons-io:2.13.0"

# What `jk deny` holds the lock to: repositories this project must never fetch from, and the
# licences an artifact may carry (one of them is enough for a dual-licensed artifact).
[deny.sources]
deny = ["jcenter.bintray.com", "repo.spring.io"]

[deny.licenses]
allow = ["Apache-2.0", "MIT", "BSD-*", "EPL-2.0"]

# A reviewed advisory: reported, never counted, until the date says to look again.
[audit]
ignore = [
  { id = "GHSA-78wr-2p64-hpwj", reason = "commons-io is test-only here; XmlStreamReader never sees untrusted input", until = "2027-03-31" },
]
