# A project that uses the hello plugin: the jar ../hello-plugin builds, pinned by its sha256. The
# [hello] table is the plugin's, validated against the schema its jk-plugin.toml declares.

name    = "greeter"
group   = "dev.jkexamples"
version = "0.1.0"
java    = 25

[application]
main = "dev.jkexamples.greeter.Greeter"

[plugins]
hello = { path = "../hello-plugin/target/hello-plugin-0.1.0.jar", sha256 = "fab614f97477e86680f5d79a95b576abac06ab60bf6b8b6d07ce77e454bc2380" }

[hello]
greeting = "Hello from a jk plugin"
