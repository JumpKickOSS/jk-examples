# Checkstyle as a cached step after compile: the rule set is the file beside this manifest, a
# finding is a diagnostic in jk-results.md with its rule id, and an error-severity finding fails
# the build (`fail-on`). Checkstyle itself is not in [dependencies]; the step fetches it at the
# pinned release. `jk explain` shows the step as `lint-checkstyle`.

name    = "lint-checkstyle"
group   = "com.example"
version = "0.0.1"
java    = 25

[application]
main = "demo.Sample"

[lint]
checkstyle = "checkstyle.xml"

# Compile-time only (@NullMarked): on javac's path, in no jar.
[provided-dependencies]
jspecify = "1.0.1"

[test-dependencies]
junit-jupiter = "6.1.3"

# Test tiers: `jk test` is the unit tier; each profile owns one of the excluded tags, so every
# tagged test runs in exactly one tier.
[test]
exclude-tags = ["integration", "slow", "network", "bench"]

[profiles.integration]
include-tags = ["integration"]
exclude-tags = []

[profiles.network]
include-tags = ["network"]
exclude-tags = ["integration"]

[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["integration", "network"]

[profiles.bench]
include-tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]
