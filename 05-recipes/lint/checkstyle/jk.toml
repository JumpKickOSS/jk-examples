# Checkstyle as a cached step after compile: the rule set is the file beside this manifest, a
# finding is a diagnostic in jk-results.md with its rule id, and an error-severity finding fails
# the build (`fail-on`). Checkstyle itself is not in [dependencies]; the step fetches it at the
# pinned release. `jk explain` shows the step as `lint-checkstyle`.

name    = "lint-checkstyle"
group   = "com.example"
version = "0.0.1"
java    = 25

[application]
main = "demo.Sample"

[lint]
checkstyle = "checkstyle.xml"

# Compile-time only (@NullMarked): on javac's path, in no jar.
[provided-dependencies]
jspecify = "1.0.1"

[test-dependencies]
junit-jupiter = "6.1.3"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
include = ["demo"]
