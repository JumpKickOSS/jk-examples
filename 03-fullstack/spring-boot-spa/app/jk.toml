name        = "app"
description = "The Spring Boot service: the /api endpoints, the static SPA, and its fallback"

[application]
main = "com.example.webapp.WebappApplication"

[spring-boot]
version = "4.1.2"

# `git.properties` and `META-INF/build-info.properties` in the Boot jar: the commit, branch and
# version the build came from.
[build-info]

# `jk image`: the default base, a JRE of this project's `java`, and a JEP 514 AOT cache trained
# with the image's own JVM.
[image]
aot-cache = true

[dependencies]
web.workspace  = true   # the SPA bundle: a resource jar with static/ at its root; `jk dev` runs its Vite server
starter-webmvc = "org.springframework.boot:spring-boot-starter-webmvc"

[dev-dependencies]
devtools = "org.springframework.boot:spring-boot-devtools"

[test-dependencies]
starter-test        = "org.springframework.boot:spring-boot-starter-test"
starter-webmvc-test = "org.springframework.boot:spring-boot-starter-webmvc-test"

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
