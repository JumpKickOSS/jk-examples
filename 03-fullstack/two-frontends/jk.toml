group = "com.example"
name = "two-frontends"
version = "0.1.0"
java = 25

# `admin` is a Vite SPA served by `app` from its classpath; `storefront` is a Next.js server of its
# own; `app` is the Spring Boot API. `jk dev` here runs all three.
[workspace]
modules = ["admin", "storefront", "app"]

# Test tiers, declared once at the root, run in every member: `jk test` runs what no suite claims;
# `@Tag("integration")` tests are the built-in integration suite's (`jk test -s integration`, or
# `jk test -g` for both), and each suite below claims one more cost tag, so every tagged test runs
# in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"
