name = "app"
description = "The service: a REST API under /api, and the SPA bundle served from classpath:static"

[application]
main = "com.example.Application"

[spring-boot]
version = "4.1.2"

# `git.properties` and Boot's `META-INF/build-info.properties` in the jar: the commit, branch and
# version the build came from.
[build-info]

# `jk image`: the default base, a JRE of this project's `java`, and a JEP 514 AOT cache trained
# with the image's own JVM.
[image]
name      = "vite-react"
aot-cache = true

[dependencies]
starter-webmvc = "org.springframework.boot:spring-boot-starter-webmvc"
# the SPA bundle: a resource jar with static/ at its root; `jk dev` runs its Vite server beside the app
web = { workspace = true }

[test-dependencies]
starter-test = "org.springframework.boot:spring-boot-starter-test"

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
