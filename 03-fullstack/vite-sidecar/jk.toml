group   = "com.example"
name    = "vite-sidecar"
version = "0.0.1"
java    = 25

[application]
main = "demo.Api"

# The front end is a node build beside the JVM sources. jk provisions the Node.js below, installs
# web/ from its package-lock.json and runs its build, so the bundle rides in the jar under static/.
# Under `jk dev` it also runs web/'s `dev` script beside the JVM — no sidecar to write.
[node]
version = 24
dir     = "web"

# Under `jk dev` — and only there — the JVM counts as ready once /api/hello answers.
[dev]
ready = "http://localhost:8080/api/hello"

[test-dependencies]
junit-jupiter = "6.1.3"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
include = ["demo"]
