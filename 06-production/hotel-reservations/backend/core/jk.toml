# The domain: hotels, room types, stays, prices and the rules a reservation lives by. Plain Java —
# no Spring, no SQL, no HTTP — so every rule is a fast unit test.
name = "core"

[export-dependencies]
jspecify.workspace = true

[test-dependencies]
junit-jupiter = "org.junit.jupiter:junit-jupiter"
assertj       = "org.assertj:assertj-core"

# NullAway over JSpecify, checking only code under @NullMarked (every hand-written package says so
# in its package-info), never generated code.
[nullness]
include = []
options = ["-XepOpt:NullAway:TreatGeneratedAsUnannotated=true"]
