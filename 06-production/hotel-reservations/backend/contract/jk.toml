# The HTTP contract: every type the front end sends or receives. Records with Bean Validation
# constraints and nothing else — no Spring, no domain types. The REST layer may expose only these.
name = "contract"

[export-dependencies]
jspecify.workspace = true
validation-api = "jakarta.validation:jakarta.validation-api"

# NullAway over JSpecify, checking only code under @NullMarked (every hand-written package says so
# in its package-info), never generated code.
[nullness]
include = []
options = ["-XepOpt:NullAway:TreatGeneratedAsUnannotated=true"]
