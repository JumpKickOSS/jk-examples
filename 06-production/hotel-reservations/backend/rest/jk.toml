# The HTTP edge and the deployable: Spring MVC controllers over the service API, Spring Security
# for the front desk, the Angular bundle as static content, and the OCI image. Depends on contract
# and service only, so a domain or jOOQ type cannot appear in a controller's signature.
name = "rest"

[application]
main = "dev.jkexamples.hotel.rest.HotelApplication"

# Spring Boot packaging. aot = true runs Spring's AOT processor at build time: bean definitions
# are generated as code instead of discovered by reflection at startup.
[spring-boot]
version = "4.1.2"
aot     = true

# `git.properties` and `META-INF/build-info.properties` in the Boot jar, for /actuator/info.
[build-info]

# The production image: a JRE 25 base, a non-root user, and a JEP 514 AOT cache trained by a run of
# the app inside the image's own JVM.
[image]
name      = "kestrel-vine-hotels"
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
user      = "65532:65532"
ports     = [8080]
aot-cache = true

[image.env]
JAVA_OPTS = "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
LOGGING_STRUCTURED_FORMAT_CONSOLE = "ecs"   # JSON log lines in production; plain text in dev

# The AOT training run alone: no database exists at build time, so skip the migrations (a runtime
# switch; Spring AOT fixed spring.flyway.enabled at build time) and exit once every bean is up. The
# cache records the whole context start, and the image never sees these.
[image.training-env]
HOTEL_MIGRATE_ON_START = "false"
SPRING_CONTEXT_EXIT    = "onRefresh"

[dependencies]
contract.workspace = true
service.workspace  = true
frontend.workspace = true    # the Angular bundle, a resource jar with static/ at its root
starter-webmvc     = "org.springframework.boot:spring-boot-starter-webmvc"
starter-validation = "org.springframework.boot:spring-boot-starter-validation"
starter-security   = "org.springframework.boot:spring-boot-starter-security"
starter-actuator   = "org.springframework.boot:spring-boot-starter-actuator"
micrometer-prometheus = "io.micrometer:micrometer-registry-prometheus"

[dev-dependencies]
devtools = "org.springframework.boot:spring-boot-devtools"

[test-dependencies]
starter-test          = "org.springframework.boot:spring-boot-starter-test"
starter-webmvc-test   = "org.springframework.boot:spring-boot-starter-webmvc-test"
starter-security-test = "org.springframework.boot:spring-boot-starter-security-test"
archunit.workspace    = true
testcontainers-postgresql = "org.testcontainers:testcontainers-postgresql"
spring-boot-testcontainers = "org.springframework.boot:spring-boot-testcontainers"
playwright.workspace  = true

[javac]
plugins = { ErrorProne = { options = ["-Xep:NullAway:ERROR", "-XepOpt:NullAway:OnlyNullMarked=true", "-XepOpt:NullAway:JSpecifyMode=true", "-XepOpt:NullAway:TreatGeneratedAsUnannotated=true", "-XepDisableWarningsInGeneratedCode"] } }
args    = ["-XDcompilePolicy=simple", "--should-stop=ifError=FLOW"]

[processor-dependencies]
error_prone_core.workspace = true
nullaway.workspace = true
