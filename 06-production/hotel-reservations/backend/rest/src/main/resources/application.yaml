# Configuration for every environment. Secrets and endpoints come from the environment
# (SPRING_DATASOURCE_URL, …); the defaults here are the local compose database.
spring:
  application:
    name: kestrel-vine-hotels
  threads:
    virtual:
      enabled: true             # a virtual thread per request: blocking JDBC without a thread-pool ceiling
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hotel}
    username: ${DATABASE_USER:hotel}
    password: ${DATABASE_PASSWORD:hotel}
    hikari:
      maximum-pool-size: 16     # virtual threads queue on the pool, not on Tomcat's workers
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jooq:
    sql-dialect: postgres
  jackson:
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  compression:
    enabled: true
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,sbom
  endpoint:
    health:
      probes:
        enabled: true
  info:
    git:
      mode: full
