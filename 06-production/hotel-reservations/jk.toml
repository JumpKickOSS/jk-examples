# Kestrel & Vine Hotels — a hotel reservation system built the way a production service is built:
# a Spring Boot 4 backend in four modules under backend/, an Angular front end under frontend/,
# PostgreSQL 18 with Flyway migrations, jOOQ generated from those migrations, and an OCI image.

group   = "dev.jkexamples.hotel"
name    = "hotel-reservations"
version = "0.1.0"
java    = 25

[workspace]
modules = ["backend/contract", "backend/core", "backend/service", "backend/rest", "frontend"]

# Spring Boot's BOM governs every member: versionless starters and their libraries resolve to
# the release below, and rest's [spring-boot] table pins the same release for the Boot jar.
[platform-dependencies]
spring-boot-dependencies = "4.1.2"

# One version of each shared library, for every member that says `<name>.workspace = true`.
[workspace.dependencies]
jspecify          = "1.0.1"
mapstruct         = "org.mapstruct:mapstruct:1.6.3"
mapstruct-processor = "org.mapstruct:mapstruct-processor:1.6.3"
archunit          = "com.tngtech.archunit:archunit-junit5:1.5.1"
testcontainers-postgresql = "org.testcontainers:testcontainers-postgresql:2.0.5"
playwright        = "com.microsoft.playwright:playwright:1.64.0"

# `jk dev` at this root runs the app (rest), the Angular dev server (frontend, proxying /api) and
# compose.yaml's database, on every OS. run-before holds the app back until PostgreSQL listens on
# TCP, not during its first-run init (the pattern matches inside compose's `db-1  | ` line prefix),
# so Flyway's first connection never races a cold volume.
# --force-recreate replaces a container a killed session left running (data stays in the volume),
# so PostgreSQL starts fresh and prints the line again. podman-compose is Python and buffers its
# output when piped, so the probe would never see the line without PYTHONUNBUFFERED; Docker's
# compose ignores it.
[dev.sidecars]
db = { command = "docker compose up --force-recreate db", env = { PYTHONUNBUFFERED = "1" }, ready-pattern = "listening on IPv4 address", ready-timeout = "3m", run-before = true }

# The code graph agents query (`jk graph query …`): the words people use for the code's names.
[graph]
[graph.aliases]
Reservation = ["booking", "stay", "confirmation"]
RoomType    = ["room category", "suite", "room kind"]
PricingPolicy = ["price", "rate", "tariff", "nightly rate"]
FrontDesk   = ["desk", "arrivals", "departures", "check-in", "check-out"]
