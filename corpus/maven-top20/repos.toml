# Pinned corpus: the 20 most-starred GitHub Java repositories (gh search, 2026-09-15) whose
# default-branch root has a pom.xml, are not docs/tutorial/Android/Tycho projects, and declare Java >= 17.
# `modules` = count of pom.xml files in the clone. `sha` = default-branch head at pin time.
# `java` = the level the root pom declares (jk imports this). `maven_jdk` = the JDK the Maven build actually
# demands when its enforcer / dependencies need more than the declared level (found on run #1).
# `import_args` = extra arguments run.py hands `jk import pom.xml` for the repo: a reactor whose root
# declares its modules only inside profiles (tutorials' README says `mvn -Pdefault,default-heavy`) is
# imported with `-P <ids>`, so the reactor is what gets measured rather than an empty workspace.
# `mvn_args` = the Maven side of the same choice: extra arguments for every `mvn` step of the repo, so
# tutorials' Maven build activates the profiles its jk import was given and the two sides stay comparable.
# Ranking source: gh search repos --language=java --sort=stars (top 100, then stars:9000..19040).

