quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# `jk dev` and the integration tier: Quarkus Dev Services starts this PostgreSQL in Docker or Podman.
quarkus.datasource.devservices.image-name=postgres:18-alpine

# Production: the database from the environment.
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/talks}
%prod.quarkus.datasource.username=${DATABASE_USER:talks}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD:talks}
