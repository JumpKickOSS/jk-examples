name = "ktor-petshop-app"

[application]
main = "com.example.petshop.ApplicationKt"
# Netty loads its native transport through System.loadLibrary; JDK 24+ warns about that unless allowed.
jvm-args = ["--enable-native-access=ALL-UNNAMED"]

# A shippable container: a JRE 25 base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

[dependencies]
ktor-petshop-domain = { workspace = true }

# Ktor — one release across every coordinate
ktor-server-core = "io.ktor:ktor-server-core-jvm:3.6.0"
ktor-server-netty = "io.ktor:ktor-server-netty-jvm:3.6.0"
ktor-server-content-negotiation = "io.ktor:ktor-server-content-negotiation-jvm:3.6.0"
ktor-serialization-jackson = "io.ktor:ktor-serialization-jackson-jvm:3.6.0"

# Koin
koin-core = "4.2.2"
koin-ktor = "4.2.2"
koin-logger-slf4j = "4.2.2"

# Exposed + H2
exposed-core = "1.6.0"
exposed-dao = "1.6.0"
exposed-jdbc = "1.6.0"
h2 = "2.5.252"

logback-classic = "1.6.5"

[test-dependencies]
junit-jupiter = "6.1.3"
junit-platform-launcher = "6.1.3"
ktor-server-test-host = "io.ktor:ktor-server-test-host-jvm:3.6.0"
koin-test = "4.2.2"
