# Spring Boot kitchen sink: web + data-jpa + validation + actuator, layered boot
# jar, Spring AOT on — exercises the spring-boot plugin's whole surface (BOM
# auto-import, boot-jar packager, AOT step, dev-scope devtools) and the core
# [build-info] table behind the actuator's /info.

name    = "kitchen-sink"
group   = "dev.jkharness"
version = "1.0.0"
java    = 25

[application]
main = "dev.jkharness.kitchensink.KitchenSinkApplication"

[spring-boot]
version       = "4.1.1"
aot           = true
aot-jvm-args  = []     # flags for the AOT processor's JVM (an --add-opens, a heap size)
aot-args      = []     # arguments the app sees while it starts under AOT processing
include-tools = true   # nest spring-boot-jarmode-tools: `java -Djarmode=tools -jar …`
platform      = true   # import spring-boot-dependencies at `version` as the BOM

# `git.properties` and `META-INF/build-info.properties` in the Boot jar: the commit, branch and
# version the build came from, which the actuator's /info reports.
[build-info]

# A shippable container: a JRE 25 base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

[dependencies]
starter-webmvc     = "org.springframework.boot:spring-boot-starter-webmvc"
starter-data-jpa   = "org.springframework.boot:spring-boot-starter-data-jpa"
starter-validation = "org.springframework.boot:spring-boot-starter-validation"
starter-actuator   = "org.springframework.boot:spring-boot-starter-actuator"

[runtime-dependencies]
h2 = "com.h2database:h2"

[dev-dependencies]
devtools = "org.springframework.boot:spring-boot-devtools"
