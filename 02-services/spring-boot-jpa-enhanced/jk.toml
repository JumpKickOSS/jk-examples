# JPA entities enhanced at build time: a lazily loaded basic column, inline dirty tracking and
# bidirectional association management, from the project's own Hibernate. Without enhancement
# Hibernate ignores FetchType.LAZY on a basic attribute and diffs every loaded entity at flush.

name    = "journal"
group   = "dev.jkexamples"
version = "0.1.0"
java    = 25

[application]
main = "dev.jkexamples.journal.JournalApplication"

[spring-boot]
version = "4.1.2"

[hibernate]
enhance                = true
lazy-initialization    = true
dirty-tracking         = true
association-management = true

[dependencies]
starter-webmvc   = "org.springframework.boot:spring-boot-starter-webmvc"
starter-data-jpa = "org.springframework.boot:spring-boot-starter-data-jpa"

[runtime-dependencies]
h2 = "com.h2database:h2"

[test-dependencies]
starter-data-jpa-test = "org.springframework.boot:spring-boot-starter-data-jpa-test"
starter-webmvc-test   = "org.springframework.boot:spring-boot-starter-webmvc-test"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true
