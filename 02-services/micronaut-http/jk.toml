group   = "com.example"
name    = "hello-http"
version = "0.1.0"
java    = 25

[application]
main = "com.example.hello.Application"
# Micronaut apps ship as a single runnable fat jar (Maven shade parity).
assembly = true

# The Micronaut platform BOM at an exact release; starters below are versionless under it.
[micronaut]
version = "5.2.5"
# Optional deploy optimization:
# aot = true
# aot-runtime = "jit"   # [native] switches it to "native" for `jk native`

# A GraalVM native executable on `jk native` (not on `jk build`); the plugin supplies Micronaut's
# native-image arguments.
[native]

# A shippable container: a JRE 25 base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

[dependencies]
micronaut-http-server-netty = "io.micronaut:micronaut-http-server-netty"
micronaut-jackson-databind  = "io.micronaut:micronaut-jackson-databind"
logback                     = "ch.qos.logback:logback-classic"

[processor-dependencies]
micronaut-inject-java = "io.micronaut:micronaut-inject-java"

[test-dependencies]
micronaut-test-junit5 = "io.micronaut.test:micronaut-test-junit5"
micronaut-http-client = "io.micronaut:micronaut-http-client"
junit-jupiter         = "managed"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true
