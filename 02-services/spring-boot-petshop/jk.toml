name    = "petshop"
group   = "com.example"
version = "0.1.0"
java    = 25

[workspace]
modules = ["domain", "service", "web"]

# Boot's BOM for every member: `service` takes `spring-context` versionless from it, and `web`'s
# [spring-boot] table pins the same release for the Boot jar.
[platform-dependencies]
spring-boot-dependencies = "4.1.2"

# Test tiers, declared once at the root, run in every member: `jk test` runs what no suite claims;
# `@Tag("integration")` tests are the built-in integration suite's (`jk test -s integration`, or
# `jk test -g` for both), and each suite below claims one more cost tag, so every tagged test runs
# in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]
