name = "petshop-web"

[application]
main = "com.example.petshop.PetshopApplication"

[spring-boot]
version = "4.1.2"

# `git.properties` and `META-INF/build-info.properties` in the Boot jar, for the actuator's /info.
[build-info]

# `jk image`: the default base, a JRE of this project's `java`, and a JEP 514 AOT cache trained
# with the image's own JVM.
[image]
aot-cache = true

[dependencies]
petshop-service = { workspace = true }
starter-webmvc = "org.springframework.boot:spring-boot-starter-webmvc"
starter-actuator = "org.springframework.boot:spring-boot-starter-actuator"
starter-validation = "org.springframework.boot:spring-boot-starter-validation"

[test-dependencies]
starter-test = "org.springframework.boot:spring-boot-starter-test"
starter-webmvc-test = "org.springframework.boot:spring-boot-starter-webmvc-test"

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
