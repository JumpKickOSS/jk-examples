# Idiomatic JumpKick Netty echo server on the published `netty-all` artifact. The full
# multi-module Netty source port lives in ../../ports/netty; this sample is the small dogfood unit
# for cold/warm benches without a 500k LOC checkout.

name    = "netty-echo"
group   = "com.example"
version = "0.1.0"
java    = 25

[application]
main = "com.example.echo.EchoServer"

# `jk image`: the default base, a JRE of this project's `java`, and a JEP 514 AOT cache trained
# with the image's own JVM.
[image]
aot-cache = true

[dependencies]
netty-all = "4.2.20.Final"

[test-dependencies]
junit-jupiter = "6.1.3"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
