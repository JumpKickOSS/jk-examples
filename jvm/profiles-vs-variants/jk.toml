# The decision matrix as running code (see jk docs/user/projects.md, "Features, profiles, variants"):
#
#   PROFILE  — how to build:   [profiles.strict] turns javac lint into errors. Optional;
#              same artifact either way.            jk build --profile strict
#   FEATURE  — what capability: [features.json] gates the gson dep. Optional, additive.
#                                                   jk build (defaults) / feature flags
#   VARIANT  — which product:  the built-in build-type dimension; release gets a
#              BUILD_STAMP resource difference via extra-src.   jk build --release
#
# Environments (dev/test/prod config) are NONE of these — that's runtime configuration
# (env vars, config files, Spring profiles): build once, promote the same artifact.

name    = "profiles-vs-variants"
group   = "dev.jkexamples"
version = "1.0.0"
java    = 25

[application]
main     = "dev.jkexamples.matrix.Main"
assembly = true   # java -jar runnable with the feature dep on the classpath

[profiles.strict]
javac = ["-Werror"]

[features]
default = ["json"]

[features.json]
deps = ["gson"]

[dependencies]
gson = { group = "com.google.code.gson", name = "gson", version = "latest", optional = true }

[variants.build-type.release]
extra-src = ["src-release"]
