# Netty module: transport-blockhound-tests (Maven artifact netty-transport-blockhound-tests)
# Generated from Mill thirdparty/netty graph — loyal multi-module port.
name    = "transport-blockhound-tests"
# group/version/java inherit from workspace root

[dependencies]
transport = { workspace = true }
handler = { workspace = true }
resolver-dns = { workspace = true }
blockhound = { group = "io.projectreactor.tools", name = "blockhound", version = "=1.0.6.RELEASE" }

[test-dependencies]
junit-jupiter-api = "=6.1.0"
junit-jupiter-params = "=6.1.0"
junit-jupiter-engine = "=6.1.0"
hamcrest-library = "=1.3"
assertj-core = "=3.18.0"
mockito-core = "=2.18.3"
reflections = "=0.10.2"
gson = "=2.8.9"
guava = "=28.2-jre"
jctools-core = "=4.0.5"
logback-classic = "=1.1.7"

# Align with junit-jupiter 5.9.x — override jk's putIfAbsent "latest" launcher (was Platform 6.x)
junit-platform-launcher = "=6.1.0"
junit-platform-engine = "=6.1.0"
junit-platform-commons = { group = "org.junit.platform", name = "junit-platform-commons", version = "=6.1.0" }
