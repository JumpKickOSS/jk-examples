# Netty module: common (Maven artifact netty-common)
# Generated from Mill thirdparty/netty graph — loyal multi-module port (JK-1174).
[project]
name    = "common"
# group/version/java inherit from workspace root

[dependencies]
jctools-core = { group = "org.jctools", name = "jctools-core", version = "=4.0.5" }

[provided-dependencies]
# Graal SVM annotations for *Substitution.java (Maven provided / Mill compileMvnDeps)
svm = { group = "org.graalvm.nativeimage", name = "svm", version = "=19.3.6" }
jctools-core = { group = "org.jctools", name = "jctools-core", version = "=4.0.5" }
annotations-java5 = { group = "org.jetbrains", name = "annotations-java5", version = "=23.0.0" }
commons-logging = { group = "commons-logging", name = "commons-logging", version = "=1.2" }
log4j-api = { group = "org.apache.logging.log4j", name = "log4j-api", version = "=2.17.2" }
log4j-1-2-api = { group = "org.apache.logging.log4j", name = "log4j-1.2-api", version = "=2.17.2" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version = "=1.7.30" }
# Optional BlockHound hooks (compile-only in Netty)
blockhound = { group = "io.projectreactor.tools", name = "blockhound", version = "=1.0.6.RELEASE" }

[test-dependencies]
jctools-core = { group = "org.jctools", name = "jctools-core", version = "=4.0.5" }
commons-logging = { group = "commons-logging", name = "commons-logging", version = "=1.2" }
log4j-api = { group = "org.apache.logging.log4j", name = "log4j-api", version = "=2.17.2" }
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version = "=2.17.2" }
log4j-1-2-api = { group = "org.apache.logging.log4j", name = "log4j-1.2-api", version = "=2.17.2" }

junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version = "=5.9.0" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version = "=5.9.0" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version = "=5.9.0" }
mockito-core = { group = "org.mockito", name = "mockito-core", version = "=2.18.3" }
hamcrest-library = { group = "org.hamcrest", name = "hamcrest-library", version = "=1.3" }
assertj-core = { group = "org.assertj", name = "assertj-core", version = "=3.18.0" }
