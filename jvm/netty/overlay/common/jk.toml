# Netty module: common (Maven artifact netty-common)
# Generated from Mill thirdparty/netty graph — loyal multi-module port.
name    = "common"
# group/version/java inherit from workspace root

[dependencies]
jctools-core = "=4.0.5"

[provided-dependencies]
# Graal SVM annotations for *Substitution.java (Maven provided / Mill compileMvnDeps)
native-image-svm = "=19.3.6"
jctools-core = "=4.0.5"
annotations-java5 = "org.jetbrains:annotations-java5:=23.0.0"
commons-logging = "=1.2"
log4j-api = "=2.17.2"
log4j12-api = "=2.17.2"
slf4j-api = "=1.7.36"
# Optional BlockHound hooks (compile-only in Netty)
blockhound = "=1.0.6.RELEASE"

[test-dependencies]
junit-jupiter-api = "=6.1.0"
junit-jupiter-params = "=6.1.0"
junit-jupiter-engine = "=6.1.0"
hamcrest-library = "=1.3"
assertj-core = "=3.18.0"
mockito-core = "=2.18.3"
reflections = "=0.10.2"
gson = "=2.8.9"
guava = "=28.2-jre"
jctools-core = "=4.0.5"
log4j-core = "=2.17.2"
log4j-api = "=2.17.2"
log4j12-api = "=2.17.2"
commons-logging = "=1.2"
annotations-java5 = "org.jetbrains:annotations-java5:=23.0.0"
logback-classic = "=1.1.7"

# Align with junit-jupiter 5.9.x — override jk's putIfAbsent "latest" launcher (was Platform 6.x)
junit-platform-launcher = "=6.1.0"
junit-platform-engine = "=6.1.0"
junit-platform-commons = "=6.1.0"
