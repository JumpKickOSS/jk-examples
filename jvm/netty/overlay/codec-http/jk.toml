# Netty module: codec-http (Maven artifact netty-codec-http)
# Generated from Mill thirdparty/netty graph — loyal multi-module port.
name    = "codec-http"
# group/version/java inherit from workspace root

[dependencies]
brotli4j = "1.23.0"
brotli4j-native-linux-x86_64 = "com.aayushatharva.brotli4j:native-linux-x86_64:1.23.0"
jzlib = "1.1.3"
common = { workspace = true }
buffer = { workspace = true }
transport = { workspace = true }
codec = { workspace = true }
handler = { workspace = true }

[provided-dependencies]
jzlib = "1.1.3"
brotli4j = "1.23.0"

[test-dependencies]
# Mill testModuleDeps = transport.test / Maven test-jar
transport = { workspace = true, kind = "tests" }
junit-jupiter-api = "5.14.3"
junit-jupiter-params = "5.14.3"
junit-jupiter-engine = "5.14.3"
hamcrest-library = "1.3"
assertj-core = "3.27.7"
mockito-core = "4.11.0"
reflections = "0.10.2"
gson = "2.8.9"
guava = "28.2-jre"
jctools-core = "4.0.5"
brotli4j = "1.23.0"
logback-classic = "1.2.13"
# Brotli natives for every platform the POM lists, so the br encoding tests find one anywhere.
brotli4j-native-linux-x86_64 = "com.aayushatharva.brotli4j:native-linux-x86_64:1.23.0"
brotli4j-native-linux-aarch64 = "com.aayushatharva.brotli4j:native-linux-aarch64:1.23.0"
brotli4j-native-linux-riscv64 = "com.aayushatharva.brotli4j:native-linux-riscv64:1.23.0"
brotli4j-native-linux-armv7 = "com.aayushatharva.brotli4j:native-linux-armv7:1.23.0"
brotli4j-native-osx-x86_64 = "com.aayushatharva.brotli4j:native-osx-x86_64:1.23.0"
brotli4j-native-osx-aarch64 = "com.aayushatharva.brotli4j:native-osx-aarch64:1.23.0"
brotli4j-native-windows-x86_64 = "com.aayushatharva.brotli4j:native-windows-x86_64:1.23.0"
