# Netty module: microbench (Maven artifact netty-microbench)
# Generated from Mill thirdparty/netty graph — loyal multi-module port.
name    = "microbench"
# group/version/java inherit from workspace root

[dependencies]
handler = { workspace = true }
codec-http = { workspace = true }
codec-http2 = { workspace = true }
codec-redis = { workspace = true }
codec-mqtt = { workspace = true }
codec-stomp = { workspace = true }
transport-classes-epoll = { workspace = true }
transport-classes-kqueue = { workspace = true }
junit-jupiter-api = "=6.1.0"
jctools-core = "=4.0.5"
jmh-core = "org.openjdk.jmh:jmh-core:=1.36"
jmh-generator-annprocess = "org.openjdk.jmh:jmh-generator-annprocess:=1.36"
agrona = "org.agrona:Agrona:=0.5.1"

[test-dependencies]
junit-jupiter-api = "=6.1.0"
junit-jupiter-params = "=6.1.0"
junit-jupiter-engine = "=6.1.0"
hamcrest-library = "=1.3"
assertj-core = "=3.18.0"
mockito-core = "=2.18.3"
reflections = "=0.10.2"
gson = "=2.8.9"
guava = "=28.2-jre"
jctools-core = "=4.0.5"
logback-classic = "=1.1.7"

# Align with junit-jupiter 5.9.x — override jk's putIfAbsent "latest" launcher (was Platform 6.x)
junit-platform-launcher = "=6.1.0"
junit-platform-engine = "=6.1.0"
junit-platform-commons = "=6.1.0"
