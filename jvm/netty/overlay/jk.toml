# Netty → JumpKick workspace root
# Loyal multi-module port of github.com/netty/netty @ netty-4.1.115.Final
# Module graph aligned with Mill example/thirdparty/netty/build.mill
#
# Applied by setup.sh over a clean Netty checkout. Sources stay upstream.

name    = "netty-parent"
group   = "io.netty"
version = "4.1.115.Final"
# Netty Maven/Mill use -source/-target 1.8; jk compiles the same sources at release 25
java    = 25

[workspace]
modules = [
    "common",
    "buffer",
    "resolver",
    "transport",
    "codec",
    "codec-dns",
    "codec-haproxy",
    "codec-http",
    "codec-http2",
    "codec-memcache",
    "codec-mqtt",
    "codec-redis",
    "codec-smtp",
    "codec-socks",
    "codec-stomp",
    "codec-xml",
    "handler",
    "handler-proxy",
    "handler-ssl-ocsp",
    "resolver-dns",
    "resolver-dns-classes-macos",
    "transport-native-unix-common",
    "transport-classes-epoll",
    "transport-classes-kqueue",
    "transport-sctp",
    "transport-rxtx",
    "transport-udt",
    "example",
    "microbench",
    "testsuite",
    "testsuite-http2",
    "testsuite-autobahn",
    "testsuite-native-image",
    "testsuite-native-image-client",
    "testsuite-native-image-client-runtime-init",
    "transport-native-unix-common-tests",
    "transport-blockhound-tests",
    "transport-native-epoll",
    "transport-native-kqueue",
    "resolver-dns-native-macos"
]

[repositories]
central = "https://repo.maven.apache.org/maven2/"
