# Netty module: codec (Maven artifact netty-codec)
# Generated from Mill thirdparty/netty graph — loyal multi-module port (JK-1174).
[project]
name    = "codec"
# group/version/java inherit from workspace root

[dependencies]
common = { workspace = true }
buffer = { workspace = true }
transport = { workspace = true }
protobuf-java = { group = "com.google.protobuf", name = "protobuf-java", version = "=2.6.1" }

[provided-dependencies]
jboss-marshalling = { group = "org.jboss.marshalling", name = "jboss-marshalling", version = "=2.0.5.Final" }
brotli4j = { group = "com.aayushatharva.brotli4j", name = "brotli4j", version = "=1.16.0" }
jzlib = { group = "com.jcraft", name = "jzlib", version = "=1.1.3" }
lz4 = { group = "net.jpountz.lz4", name = "lz4", version = "=1.3.0" }
compress-lzf = { group = "com.ning", name = "compress-lzf", version = "=1.0.3" }
lzma-java = { group = "com.github.jponge", name = "lzma-java", version = "=1.3" }
zstd-jni = { group = "com.github.luben", name = "zstd-jni", version = "=1.5.5-11" }
protobuf-javanano = { group = "com.google.protobuf.nano", name = "protobuf-javanano", version = "=3.0.0-alpha-5" }

[test-dependencies]
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version = "=5.9.0" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version = "=5.9.0" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version = "=5.9.0" }
mockito-core = { group = "org.mockito", name = "mockito-core", version = "=2.18.3" }
hamcrest-library = { group = "org.hamcrest", name = "hamcrest-library", version = "=1.3" }
assertj-core = { group = "org.assertj", name = "assertj-core", version = "=3.18.0" }
