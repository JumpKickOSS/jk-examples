# Netty module: codec (Maven artifact netty-codec)
# Generated from Mill thirdparty/netty graph — loyal multi-module port.
name    = "codec"
# group/version/java inherit from workspace root

[dependencies]
common = { workspace = true }
buffer = { workspace = true }
transport = { workspace = true }
protobuf-java = "=2.6.1"
compress-lzf = { group = "com.ning", name = "compress-lzf", version = "=1.0.3" }
jzlib = { group = "com.jcraft", name = "jzlib", version = "=1.1.3" }
lz4 = { group = "net.jpountz.lz4", name = "lz4", version = "=1.3.0" }
zstd-jni = "=1.5.5-11"
brotli4j = { group = "com.aayushatharva.brotli4j", name = "brotli4j", version = "=1.16.0" }
brotli4j-native-linux-x86_64 = { group = "com.aayushatharva.brotli4j", name = "native-linux-x86_64", version = "=1.16.0" }
lzma-java = { group = "com.github.jponge", name = "lzma-java", version = "=1.3" }
jboss-marshalling = { group = "org.jboss.marshalling", name = "jboss-marshalling", version = "=2.0.5.Final" }

[provided-dependencies]
jboss-marshalling = { group = "org.jboss.marshalling", name = "jboss-marshalling", version = "=2.0.5.Final" }
brotli4j = { group = "com.aayushatharva.brotli4j", name = "brotli4j", version = "=1.16.0" }
jzlib = { group = "com.jcraft", name = "jzlib", version = "=1.1.3" }
lz4 = { group = "net.jpountz.lz4", name = "lz4", version = "=1.3.0" }
compress-lzf = { group = "com.ning", name = "compress-lzf", version = "=1.0.3" }
lzma-java = { group = "com.github.jponge", name = "lzma-java", version = "=1.3" }
zstd-jni = "=1.5.5-11"
protobuf-javanano = { group = "com.google.protobuf.nano", name = "protobuf-javanano", version = "=3.0.0-alpha-5" }

[test-dependencies]
# Mill testModuleDeps = transport.test / Maven test-jar
transport = { workspace = true, kind = "tests" }
junit-jupiter-api = "=6.1.0"
junit-jupiter-params = "=6.1.0"
junit-jupiter-engine = "=6.1.0"
hamcrest-library = "=1.3"
assertj-core = "=3.18.0"
mockito-core = "=2.18.3"
reflections = "=0.10.2"
gson = "=2.8.9"
guava = "=28.2-jre"
jctools-core = "=4.0.5"
jboss-marshalling-serial = { group = "org.jboss.marshalling", name = "jboss-marshalling-serial", version = "=2.0.5.Final" }
jboss-marshalling-river = { group = "org.jboss.marshalling", name = "jboss-marshalling-river", version = "=2.0.5.Final" }
commons-compress = "=1.26.0"
brotli4j = { group = "com.aayushatharva.brotli4j", name = "brotli4j", version = "=1.16.0" }
logback-classic = "=1.1.7"

# Align with junit-jupiter 5.9.x — override jk's putIfAbsent "latest" launcher (was Platform 6.x)
junit-platform-launcher = "=6.1.0"
junit-platform-engine = "=6.1.0"
junit-platform-commons = { group = "org.junit.platform", name = "junit-platform-commons", version = "=6.1.0" }
