# House rules for the Netty port: the monorepo pack for the workspace shape, plus the per-file
# ratchet. Upstream sources are what they are; the baseline records today's sites and the cap
# only tightens from there. Applied to checkout/ by setup.sh like every other overlay file.
[guards]
extends = ["cc.jumpkick.guards:monorepo:0.20.0"]

[guards.file-size]
kind     = "metric"
measure  = "lines"
cap      = 800
baseline = true
why      = "a file that no longer fits a review no longer fits a reviewer"

# Upstream Netty puts JMH benchmarks and a few split-out modules in packages another module owns
# (microbench in io.netty.buffer, codec-xml in io.netty.handler.codec.xml, ...). A baseline again:
# the sites upstream ships are recorded, and the port refuses new ones.
[guards.one-module-per-package]
baseline = true
