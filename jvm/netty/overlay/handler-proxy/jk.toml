# Netty module: handler-proxy (Maven artifact netty-handler-proxy)
# Generated from Mill thirdparty/netty graph — loyal multi-module port.
name    = "handler-proxy"
# group/version/java inherit from workspace root

[dependencies]
common = { workspace = true }
buffer = { workspace = true }
transport = { workspace = true }
codec = { workspace = true }
codec-socks = { workspace = true }
codec-http = { workspace = true }
handler = { workspace = true }

[test-dependencies]
# Mill testModuleDeps = transport.test / Maven test-jar
transport = { workspace = true, kind = "tests" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version = "=6.1.0" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version = "=6.1.0" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version = "=6.1.0" }
hamcrest-library = { group = "org.hamcrest", name = "hamcrest-library", version = "=1.3" }
assertj-core = { group = "org.assertj", name = "assertj-core", version = "=3.18.0" }
mockito-core = { group = "org.mockito", name = "mockito-core", version = "=2.18.3" }
reflections = { group = "org.reflections", name = "reflections", version = "=0.10.2" }
gson = { group = "com.google.code.gson", name = "gson", version = "=2.8.9" }
guava = { group = "com.google.guava", name = "guava", version = "=28.2-jre" }
jctools-core = { group = "org.jctools", name = "jctools-core", version = "=4.0.5" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version = "=1.1.7" }

# Align with junit-jupiter 5.9.x — override jk's putIfAbsent "latest" launcher (was Platform 6.x)
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version = "=6.1.0" }
junit-platform-engine = { group = "org.junit.platform", name = "junit-platform-engine", version = "=6.1.0" }
junit-platform-commons = { group = "org.junit.platform", name = "junit-platform-commons", version = "=6.1.0" }
