[dependencies]
common = { workspace = true }
resolver = { workspace = true }
transport = { workspace = true }
transport-sctp = { workspace = true }
handler = { workspace = true }
codec-http = { workspace = true }
transport-udt = { workspace = true }
slf4j-api = "=1.7.36"
xz = "=1.5"
junit-jupiter-api = "=6.1.0"
junit-jupiter-params = "=6.1.0"
hamcrest-library = "=1.3"
assertj-core = "=3.18.0"
mockito-core = "=2.18.3"

[test-dependencies]
junit-jupiter-api = "=6.1.0"
junit-jupiter-params = "=6.1.0"
junit-jupiter-engine = "=6.1.0"
hamcrest-library = "=1.3"
assertj-core = "=3.18.0"
mockito-core = "=2.18.3"
reflections = "=0.10.2"
