# Idiomatic JumpKick Netty echo server on the published `netty-all` artifact. The full
# multi-module Netty source port lives in ../netty; this sample is the small dogfood unit
# for cold/warm benches without a 500k LOC checkout.

name    = "netty-echo"
group   = "com.example"
version = "0.1.0"
java    = 25

[application]
main = "com.example.echo.EchoServer"

[dependencies]
netty-all = "4.2.18.Final"

[test-dependencies]
junit-jupiter = "6.1.3"
junit-platform-launcher = "6.1.3"

# Test tiers. Bare `jk test` is the unit tier; each profile owns exactly one of the excluded
# tags, so every tagged test runs in one tier and none is silently skipped.
[test]
exclude-tags = ["integration", "slow", "network", "bench"]

[profiles.integration]
include-tags = ["integration"]
exclude-tags = []

[profiles.network]
include-tags = ["network"]
exclude-tags = ["integration"]

[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["integration", "network"]

[profiles.bench]
include-tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[profiles.ci]
exclude-tags = ["integration", "slow", "network", "bench"]
