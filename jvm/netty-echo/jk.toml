# Idiomatic JumpKick Netty echo server on the published `netty-all` artifact. The full
# multi-module Netty source port lives in ../netty; this sample is the small dogfood unit
# for cold/warm benches without a 500k LOC checkout.

name    = "netty-echo"
group   = "com.example"
version = "0.1.0"
java    = 25

[application]
main = "com.example.echo.EchoServer"

[dependencies]
netty-all = { group = "io.netty", name = "netty-all", version = "latest" }

[test-dependencies]
junit-jupiter = "latest"
junit-platform-launcher = "latest"
