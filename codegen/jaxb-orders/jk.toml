# XML schemas as generated classes: [jaxb] runs xjc over src/main/xsd in the generate stage, the
# classes join the compile, and a schema edit regenerates. xjc itself is not in [dependencies];
# the preset fetches it at the pinned release.

name    = "jaxb-orders"
group   = "com.acme"
version = "1.0.0"
java    = 25

[application]
main = "com.acme.Main"

# One package for every generated class (-p) in place of the schema's namespace-derived one. The
# xjc release follows `version`, 4.0.9 unless you say otherwise; the runtime below is its line.
[jaxb]
package = "com.acme.order"

[dependencies]
jakarta-xml-bind-api = "4.0.5"    # the generated classes' annotations
jaxb-runtime         = "4.0.9"    # the JAXB implementation at run time, on xjc's line

[test-dependencies]
junit-jupiter = "6.1.3"

# Test tiers: `jk test` is the unit tier; each profile owns one of the excluded tags, so every
# tagged test runs in exactly one tier.
[test]
exclude-tags = ["integration", "slow", "network", "bench"]

[profiles.integration]
include-tags = ["integration"]
exclude-tags = []

[profiles.network]
include-tags = ["network"]
exclude-tags = ["integration"]

[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["integration", "network"]

[profiles.bench]
include-tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]
