# jOOQ classes from the migrations: [jooq] applies the Flyway scripts under db/migration to an
# in-memory database in the generate stage and generates the tables' classes, which join the
# compile; a migration edit regenerates and no database runs for the build. The generator is not
# in [dependencies]; the preset fetches it at the pinned release.

name    = "jooq-shop"
group   = "com.acme"
version = "1.0.0"
java    = 25

[application]
main = "com.acme.Main"

# The scripts default to src/main/resources/db/migration/**/*.sql and the package to <group>.jooq.
# Flyway's own history table is a table like any other to DDLDatabase, so it is left out here.
# The generator release follows `version`, 3.21.8 unless you say otherwise.
[jooq]
excludes = "flyway_schema_history"

[dependencies]
jooq = "3.21.8"     # the generated classes read it at run time; on the generator's number

[test-dependencies]
junit-jupiter = "6.1.3"

# Test tiers: `jk test` is the unit tier; each profile owns one of the excluded tags, so every
# tagged test runs in exactly one tier.
[test]
exclude-tags = ["integration", "slow", "network", "bench"]

[profiles.integration]
include-tags = ["integration"]
exclude-tags = []

[profiles.network]
include-tags = ["network"]
exclude-tags = ["integration"]

[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["integration", "network"]

[profiles.bench]
include-tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]
