# Spring Boot kitchen sink: web + data-jpa + validation + actuator, layered boot
# jar, Spring AOT on — exercises the spring-boot plugin's whole surface (BOM
# auto-import, boot-jar packager, AOT step, build-info, dev-scope devtools).

name    = "kitchen-sink"
group   = "dev.jkharness"
version = "1.0.0"
java    = 25

[application]
main = "dev.jkharness.kitchensink.KitchenSinkApplication"

[spring-boot]
version    = "latest"
aot        = true
build-info = true

# A shippable container: a JRE 25 base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

[dependencies]
starter-web        = "org.springframework.boot:spring-boot-starter-web"
starter-data-jpa   = "org.springframework.boot:spring-boot-starter-data-jpa"
starter-validation = "org.springframework.boot:spring-boot-starter-validation"
starter-actuator   = "org.springframework.boot:spring-boot-starter-actuator"

[runtime-dependencies]
h2 = "com.h2database:h2"

[dev-dependencies]
devtools = "org.springframework.boot:spring-boot-devtools"

[test-dependencies]
starter-test = "org.springframework.boot:spring-boot-starter-test"
