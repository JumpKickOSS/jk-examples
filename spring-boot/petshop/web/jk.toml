name = "petshop-web"

[application]
main = "com.example.petshop.PetshopApplication"

[spring-boot]
version = "latest"

# A shippable container: a JRE 25 base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

[dependencies]
petshop-service = { workspace = true }
starter-webmvc = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc" }
starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }

[test-dependencies]
starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
starter-webmvc-test = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc-test" }
