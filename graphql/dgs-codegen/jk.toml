# GraphQL code generation as a [generate] recipe: DGS codegen's command line, from its core jar,
# turns the schema into typed Java classes and a typed query builder. The tool's runtime closure is
# fetched with it; the step is cached on the schema, the arguments and the tool version.

name    = "dgs-codegen"
group   = "com.acme"
version = "1.0.0"
java    = 25

[application]
main = "com.acme.graphql.Main"

# The types land under com.acme.graphql.types, the client under com.acme.graphql.client; a schema
# edit re-runs the step and an unchanged schema is a cache hit (`jk explain`).
[generate.dgs]
tool    = "com.netflix.graphql.dgs.codegen:graphql-dgs-codegen-core:8.6.0"
main    = "com.netflix.graphql.dgs.codegen.CodeGenCli"
inputs  = ["src/main/resources/schema/**/*.graphqls"]
args    = ["--output-dir", "${out}", "--package-name", "com.acme.graphql", "--generate-client", "${inputs}"]
discard = ["generated-examples"]   # the CLI's example data fetchers, which need the DGS runtime

# The generated client extends the query builder base classes this jar carries, at the codegen's
# own version; the types need nothing beyond the JDK.
[dependencies]
graphql-dgs-codegen-shared-core = "com.netflix.graphql.dgs.codegen:graphql-dgs-codegen-shared-core:8.6.0"

[test-dependencies]
junit-jupiter = "6.1.3"
