# A small library as it is published: jar, sources jar and javadoc jar, a POM Maven Central would
# accept ([publish]), git.properties ([build-info]) and an SBOM. No [application]: a library.

group = "dev.jkexamples"
name = "money"
version = "0.1.0"
java = 25
description = "Exact money arithmetic: one currency per amount, allocation that never loses a cent"

[dependencies]
jspecify = "1.0.1"

[test-dependencies]
junit-jupiter = "6.1.3"

# What a release POM carries beyond the coordinate. Maven Central refuses a POM without all of it.
[publish]
name = "jk-examples money"
url = "https://github.com/JumpKickOSS/jk-examples/tree/main/01-start/java-library"
licenses = [{ name = "Apache-2.0", url = "https://www.apache.org/licenses/LICENSE-2.0" }]
developers = [{ id = "jumpkick", name = "JumpKick examples" }]
scm = { url = "https://github.com/JumpKickOSS/jk-examples",
        connection = "scm:git:https://github.com/JumpKickOSS/jk-examples.git",
        developer-connection = "scm:git:ssh://git@github.com/JumpKickOSS/jk-examples.git" }

# `git.properties` in the jar: the commit, branch and dirty flag the library was built from.
[build-info]

# Test tiers: `jk test` is the fast tier; each profile owns one cost tag, so every tagged
# test runs in exactly one tier (`jk test -p integration`).
[test]
exclude-tags = ["integration", "network", "slow", "bench"]

[profiles.integration]
include-tags = ["integration"]
exclude-tags = []

[profiles.network]
include-tags = ["network"]
exclude-tags = ["integration"]

[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["integration", "network"]

[profiles.bench]
include-tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"
