# A framework-free workspace: three modules, one lockfile, identity and test tiers declared once.

group   = "dev.jkexamples"
name    = "links"
version = "0.1.0"
java    = 25

[workspace]
modules = ["api", "store", "cli"]

# One version of each shared library for every module; members opt in with `<name>.workspace = true`.
[workspace.dependencies]
jspecify      = "1.0.1"
junit-jupiter = "6.1.3"

# Test tiers, declared once at the root, run in every member: `jk test` runs what no suite claims;
# `@Tag("integration")` tests are the built-in integration suite's (`jk test -s integration`, or
# `jk test -g` for both), and each suite below claims one more cost tag, so every tagged test runs
# in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true
