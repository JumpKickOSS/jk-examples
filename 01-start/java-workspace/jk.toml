# A framework-free workspace: three modules, one lockfile, identity and test tiers declared once.

group   = "dev.jkexamples"
name    = "links"
version = "0.1.0"
java    = 25

[workspace]
modules = ["api", "store", "cli"]

# One version of each shared library for every module; members opt in with `<name>.workspace = true`.
[workspace.dependencies]
jspecify      = "1.0.1"
junit-jupiter = "6.1.3"

# Test tiers need no table here: a test tagged `@Tag("integration")` belongs to the built-in
# integration suite in every member, so `jk test` leaves it out and `jk test -s integration` runs
# it. A [test.suites.<name>] declared at this root would run in every member too.
