# Two LinkStore implementations. Their tests reuse api's contract test through api's test classes.
name = "store"

[dependencies]
api.workspace = true

[test-dependencies]
junit-jupiter.workspace = true
api = { workspace = true, kind = "tests" }

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
