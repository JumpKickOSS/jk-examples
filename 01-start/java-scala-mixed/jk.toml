# One module compiling Java and Scala together in a single Zinc session — the shape Metals imports
# through jk's BSP: a build target whose languageIds name both languages and whose data carries the
# Scala compiler version and jars, answering buildTarget/scalacOptions and buildTarget/javacOptions.

name    = "scala-mixed"
group   = "com.example"
version = "0.1.0"
java    = 25
scala   = "3.10.0"

[application]
main = "com.example.mixed.Main"

# The library pack asks a package with a Java class in it to be @NullMarked (package-info.java).
# JSpecify alone, not [nullness]: Error Prone and NullAway would sit in javacOptions, which the BSP
# transcript in the README records as jk's Zinc session passes them.
[dependencies]
jspecify = "1.0.1"

[test-dependencies]
junit-jupiter = "6.1.3"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true
