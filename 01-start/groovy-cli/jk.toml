# A Groovy CLI with a Java half: Groovy and Java sources share one module and compile jointly, so
# Groovy calls the Java record and Java calls the Groovy class. Spock specs run on the JUnit Platform.

name    = "groovy-cli"
group   = "dev.jkexamples"
version = "0.1.0"
java    = 25
groovy  = "6.0.0"

[application]
main = "dev.jkexamples.tally.Main"

[dependencies]
groovy-cli-picocli = "org.apache.groovy:groovy-cli-picocli:6.0.0"
groovy-json        = "org.apache.groovy:groovy-json:6.0.0"

[test-dependencies]
spock-core = "org.spockframework:spock-core:2.5-groovy-6.0"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]
