# Project-declared Kotlin compiler plugins ([[kotlin-plugins]]): kotlinx-serialization's
# codegen only exists when the plugin actually loaded into kotlinc — compiling a
# reference to the generated serializer IS the validation.

name    = "serialization-cli"
group   = "dev.jkharness"
version = "1.0.0"
java    = 25
kotlin  = "2.4.21"

[application]
main = "dev.jkharness.ser.MainKt"

# No version: the plugin rides the resolved Kotlin compiler version.
[[kotlin-plugins]]
coordinate = "org.jetbrains.kotlin:kotlin-serialization-compiler-plugin-embeddable"

[dependencies]
kotlinx-serialization-json = "1.12.0"

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"
