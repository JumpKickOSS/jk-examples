# Vanilla JVM AOT: no framework, no plugin — exercises jk's core `jk build --aot-cache`
# (self-assembled AOT layout on JDK 25; AppCDS fallback below) and `jk run` startup.

name    = "vanilla-cli"
group   = "dev.jkharness"
version = "1.0.0"
java    = 25

[application]
main = "dev.jkharness.aot.Main"

[dependencies]
gson = "2.14.0"
