# Vanilla JVM AOT: no framework, no plugin — exercises jk's core `jk build --aot-cache`, a JEP 514
# AOT cache trained from one run and started by target/aot-cache/run.sh.

name    = "vanilla-cli"
group   = "dev.jkharness"
version = "1.0.0"
java    = 25

[application]
main = "dev.jkharness.aot.Main"

[dependencies]
gson = "2.14.0"
