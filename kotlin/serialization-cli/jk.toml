# Project-declared Kotlin compiler plugins ([[kotlin-plugins]]): kotlinx-serialization's
# codegen only exists when the plugin actually loaded into kotlinc — compiling a
# reference to the generated serializer IS the validation.

name    = "serialization-cli"
group   = "dev.jkharness"
version = "1.0.0"
java    = 25
kotlin  = "2.4.20"

[application]
main = "dev.jkharness.ser.MainKt"

# No version: the plugin rides the resolved Kotlin compiler version.
[[kotlin-plugins]]
coordinate = "org.jetbrains.kotlin:kotlin-serialization-compiler-plugin-embeddable"

[dependencies]
kotlinx-serialization-json = "1.11.0"
