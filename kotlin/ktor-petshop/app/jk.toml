name = "ktor-petshop-app"

[application]
main = "com.example.petshop.ApplicationKt"

# A shippable container: a JRE 25 base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

[dependencies]
ktor-petshop-domain = { workspace = true }

# Ktor — every coordinate floats; jk-lock.toml pins the one version they all share
ktor-server-core = "io.ktor:ktor-server-core-jvm:latest"
ktor-server-netty = "io.ktor:ktor-server-netty-jvm:latest"
ktor-server-content-negotiation = "io.ktor:ktor-server-content-negotiation-jvm:latest"
ktor-serialization-jackson = "io.ktor:ktor-serialization-jackson-jvm:latest"

# Koin
koin-core = "latest"
koin-ktor = "latest"
koin-logger-slf4j = "latest"

# Exposed + H2
exposed-core = "latest"
exposed-dao = "latest"
exposed-jdbc = "latest"
h2 = "latest"

logback-classic = "latest"

[test-dependencies]
junit-jupiter = "latest"
junit-platform-launcher = "latest"
ktor-server-test-host = "io.ktor:ktor-server-test-host-jvm:latest"
koin-test = "latest"
