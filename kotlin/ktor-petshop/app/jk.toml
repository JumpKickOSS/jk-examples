name = "ktor-petshop-app"

[application]
main = "com.example.petshop.ApplicationKt"

[dependencies]
ktor-petshop-domain = { workspace = true }

# Ktor — every coordinate floats; jk-lock.toml pins the one version they all share
ktor-server-core = { group = "io.ktor", name = "ktor-server-core-jvm", version = "latest" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty-jvm", version = "latest" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation-jvm", version = "latest" }
ktor-serialization-jackson = { group = "io.ktor", name = "ktor-serialization-jackson-jvm", version = "latest" }

# Koin
koin-core = { group = "io.insert-koin", name = "koin-core", version = "latest" }
koin-ktor = { group = "io.insert-koin", name = "koin-ktor", version = "latest" }
koin-logger-slf4j = { group = "io.insert-koin", name = "koin-logger-slf4j", version = "latest" }

# Exposed + H2
exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version = "latest" }
exposed-dao = { group = "org.jetbrains.exposed", name = "exposed-dao", version = "latest" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version = "latest" }
h2 = { group = "com.h2database", name = "h2", version = "latest" }

logback-classic = { group = "ch.qos.logback", name = "logback-classic", version = "latest" }

[test-dependencies]
junit-jupiter = "latest"
junit-platform-launcher = "latest"
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host-jvm", version = "latest" }
koin-test = { group = "io.insert-koin", name = "koin-test", version = "latest" }
