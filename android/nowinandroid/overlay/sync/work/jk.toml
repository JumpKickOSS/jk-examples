[project]
name    = "nia-sync-work"
group   = "com.google.samples.apps.nowinandroid"
version = "0.1.0"
java    = 21
kotlin  = "^2.4.0"

[android]
namespace   = "com.google.samples.apps.nowinandroid.sync"
compile-sdk = 34
min-sdk     = 23
library     = true

[variants.contentType.demo]
extra-src = ["src/demo/kotlin"]

[variants.contentType.prod]
extra-src = ["src/prod/kotlin"]

[dependencies]
tracing-ktx      = { group = "androidx.tracing", name = "tracing-ktx", version = "1.3.0-alpha02" }
work-ktx         = { group = "androidx.work", name = "work-runtime-ktx", version = "2.11.2" }
hilt-ext-work    = { group = "androidx.hilt", name = "hilt-work", version = "1.2.0" }
nia-core-analytics     = { workspace = true }
nia-core-data          = { workspace = true }
nia-core-notifications = { workspace = true }
hilt-android     = { group = "com.google.dagger", name = "hilt-android", version = "=2.59" }
# ListenableFuture lives in guava (the 9999.0-empty listenablefuture artifact is by design);
# jk finding 15: unified-scope resolution lets processor-scope guava evict main-scope LF 1.0.
guava            = { group = "com.google.guava", name = "guava", version = "33.6.0-android" }

[processor-dependencies]
hilt-compiler     = { group = "com.google.dagger", name = "hilt-android-compiler", version = "=2.59" }
hilt-ext-compiler = { group = "androidx.hilt", name = "hilt-compiler", version = "1.2.0" }

[test-dependencies]
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version = "=6.1.1" }

[repositories]
central = "https://repo.maven.apache.org/maven2/"
google  = "https://dl.google.com/dl/android/maven2/"
