name    = "nia-app"
group   = "com.google.samples.apps.nowinandroid"
version = "0.1.0"
java    = 21
kotlin  = "^2.4.0"

[android]
namespace   = "com.google.samples.apps.nowinandroid"
compile-sdk = 36
min-sdk     = 23
hilt        = true
compose     = true
build-config = true

[android.signing.release]
store-file     = "env:RELEASE_KEYSTORE"
store-password = "env:RELEASE_STORE_PASSWORD"
key-alias      = "upload"
key-password   = "env:RELEASE_KEY_PASSWORD"

[variants.build-type.release.android]
proguard-files = ["proguard-rules.pro", "jk-missing-rules.pro"]
signing        = "release"

[variants.contentType.demo.android]
application-id-suffix = ".demo"

[variants.contentType.prod]

[[kotlin-plugins]]
coordinate = "org.jetbrains.kotlin:kotlin-serialization-compiler-plugin-embeddable"

[platform-dependencies]
compose = { group = "androidx.compose", name = "compose-bom-alpha", version = "=2026.07.01" }

[dependencies]
nia-feature-interests-api = { workspace = true }
nia-feature-interests-impl = { workspace = true }
nia-feature-foryou-api    = { workspace = true }
nia-feature-foryou-impl   = { workspace = true }
nia-feature-bookmarks-api = { workspace = true }
nia-feature-bookmarks-impl = { workspace = true }
nia-feature-topic-api     = { workspace = true }
nia-feature-topic-impl    = { workspace = true }
nia-feature-search-api    = { workspace = true }
nia-feature-search-impl   = { workspace = true }
nia-feature-settings-impl = { workspace = true }
nia-core-common       = { workspace = true }
nia-core-ui           = { workspace = true }
nia-core-designsystem = { workspace = true }
nia-core-data         = { workspace = true }
nia-core-model        = { workspace = true }
nia-core-analytics    = { workspace = true }
nia-core-navigation   = { workspace = true }
nia-sync-work         = { workspace = true }
activity-compose  = { group = "androidx.activity", name = "activity-compose", version = "=1.13.0" }
material3         = { group = "androidx.compose.material3", name = "material3" }
nav3-ui           = { group = "androidx.navigation3", name = "navigation3-ui", version = "=1.0.1" }
adaptive          = { group = "androidx.compose.material3.adaptive", name = "adaptive" }
adaptive-layout   = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout" }
adaptive-nav      = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation" }
adaptive-nav3     = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3" }
window-size-class = { group = "androidx.compose.material3", name = "material3-window-size-class" }
core-ktx          = { group = "androidx.core", name = "core-ktx", version = "=1.19.0" }
splashscreen      = { group = "androidx.core", name = "core-splashscreen", version = "=1.0.1" }
lifecycle-rt-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version = "=2.11.0" }
lifecycle-vm-nav3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version = "=2.11.0" }
hilt-android      = { group = "com.google.dagger", name = "hilt-android", version = "=2.60.1" }
tracing-ktx = { group = "androidx.tracing", name = "tracing-ktx", version = "=1.3.0" }
kotlinx-serialization-json = "=1.8.0"
coroutines-guava  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-guava", version = "=1.10.1" }
profileinstaller  = { group = "androidx.profileinstaller", name = "profileinstaller", version = "=1.4.1" }

[processor-dependencies]
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version = "=2.60.1" }

[test-dependencies]
junit-platform-launcher = "=6.1.1"

[repositories]
central = "https://repo.maven.apache.org/maven2/"
google  = "https://dl.google.com/dl/android/maven2/"
