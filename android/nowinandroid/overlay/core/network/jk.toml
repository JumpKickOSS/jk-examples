name    = "nia-core-network"
group   = "com.google.samples.apps.nowinandroid"
version = "0.1.0"
java    = 21
kotlin  = "2.4.20"

[android]
namespace    = "com.google.samples.apps.nowinandroid.core.network"
compile-sdk = 36   # NiA pins 36; 34 rides the warm test SDK — bump if API-36 symbols surface
min-sdk      = 23
library      = true
build-config        = true
build-config-fields = ['String BACKEND_URL = "http://example.com"']

[variants.contentType.demo]
extra-src = ["src/demo/kotlin"]

[variants.contentType.prod]
extra-src = ["src/prod/kotlin"]

[[kotlin-plugins]]
coordinate = "org.jetbrains.kotlin:kotlin-serialization-compiler-plugin-embeddable"

[dependencies]
kotlinx-datetime   = "=0.6.1"
nia-core-common    = { workspace = true }
nia-core-model     = { workspace = true }
coil               = "=2.7.0"
coil-svg           = "=2.7.0"
kotlinx-serialization-json = "=1.8.0"
okhttp-logging-interceptor     = "=4.12.0"
retrofit           = "=2.11.0"
retrofit-converter-kotlinx-serialization   = "=2.11.0"
hilt-android       = "=2.60.1"
tracing-ktx = "=1.3.0"

[processor-dependencies]
hilt-compiler = "com.google.dagger:hilt-android-compiler:=2.60.1"

[test-dependencies]
junit-platform-launcher = "=6.1.1"

[repositories]
central = "https://repo.maven.apache.org/maven2/"
google  = "https://dl.google.com/dl/android/maven2/"
