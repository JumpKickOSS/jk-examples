name    = "nia-core-data"
group   = "com.google.samples.apps.nowinandroid"
version = "0.1.0"
java    = 21
kotlin  = "^2.4.0"

[android]
namespace   = "com.google.samples.apps.nowinandroid.core.data"
compile-sdk = 36
min-sdk     = 23
library     = true

[dependencies]
nia-core-common        = { workspace = true }
nia-core-database      = { workspace = true }
nia-core-datastore     = { workspace = true }
nia-core-network       = { workspace = true }
nia-core-analytics     = { workspace = true }
nia-core-notifications = { workspace = true }
nia-core-model         = { workspace = true }
tracing-ktx = { group = "androidx.tracing", name = "tracing-ktx", version = "=1.3.0" }
hilt-android           = { group = "com.google.dagger", name = "hilt-android", version = "=2.60.1" }

[processor-dependencies]
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version = "=2.60.1" }

[test-dependencies]
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version = "=6.1.1" }

[repositories]
central = "https://repo.maven.apache.org/maven2/"
google  = "https://dl.google.com/dl/android/maven2/"
