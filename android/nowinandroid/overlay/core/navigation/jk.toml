[project]
name    = "nia-core-navigation"
group   = "com.google.samples.apps.nowinandroid"
version = "0.1.0"
java    = 21
kotlin  = "^2.4.0"

[android]
namespace   = "com.google.samples.apps.nowinandroid.core.navigation"
compile-sdk = 36
min-sdk     = 23
library     = true
compose     = true

[[kotlin-plugins]]
coordinate = "org.jetbrains.kotlin:kotlin-serialization-compiler-plugin-embeddable"

[platform-dependencies]
compose = { group = "androidx.compose", name = "compose-bom-alpha", version = "=2026.07.01" }

[dependencies]
navigation3-runtime  = { group = "androidx.navigation3", name = "navigation3-runtime", version = "=1.0.1" }
savedstate-compose   = { group = "androidx.savedstate", name = "savedstate-compose", version = "=1.4.0" }
lifecycle-vm-nav3    = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version = "=2.11.0" }
serialization-json   = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "=1.8.0" }
hilt-android         = { group = "com.google.dagger", name = "hilt-android", version = "=2.60.1" }
[processor-dependencies]
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version = "=2.60.1" }

[test-dependencies]
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version = "=6.1.1" }

[repositories]
central = "https://repo.maven.apache.org/maven2/"
google  = "https://dl.google.com/dl/android/maven2/"
