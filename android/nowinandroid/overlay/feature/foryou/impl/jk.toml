name    = "nia-feature-foryou-impl"
group   = "com.google.samples.apps.nowinandroid"
version = "0.1.0"
java    = 21
kotlin  = "2.4.20"

[android]
namespace   = "com.google.samples.apps.nowinandroid.feature.foryou.impl"
compile-sdk = 36
min-sdk     = 23
library     = true
compose     = true

[[kotlin-plugins]]
coordinate = "org.jetbrains.kotlin:kotlin-serialization-compiler-plugin-embeddable"

[platform-dependencies]
compose = "androidx.compose:compose-bom-alpha:=2026.07.01"

[dependencies]
nia-core-ui = { workspace = true }
nia-core-designsystem = { workspace = true }
lifecycle-rt-compose = "androidx.lifecycle:lifecycle-runtime-compose:=2.11.0"
lifecycle-vm-compose = "androidx.lifecycle:lifecycle-viewmodel-compose:=2.11.0"
hilt-vm-compose      = "androidx.hilt:hilt-lifecycle-viewmodel-compose:=1.4.0"
navigation3-runtime  = "=1.0.1"
tracing-ktx = "=1.3.0"
hilt-android         = "=2.60.1"
nia-core-navigation = { workspace = true }
accompanist-perms    = "com.google.accompanist:accompanist-permissions:=0.37.0"
nia-core-domain = { workspace = true }
nia-core-notifications = { workspace = true }
nia-feature-foryou-api = { workspace = true }
nia-feature-topic-api = { workspace = true }
activity-compose     = "=1.13.0"
nia-core-data = { workspace = true }
[processor-dependencies]
hilt-compiler = "com.google.dagger:hilt-android-compiler:=2.60.1"

[test-dependencies]
junit-platform-launcher = "=6.1.1"

[repositories]
central = "https://repo.maven.apache.org/maven2/"
google  = "https://dl.google.com/dl/android/maven2/"
